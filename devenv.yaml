inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  otahontas-nixpkgs:
    url: github:otahontas/nixpkgs
  # Pi extension typechecks use the same Pi package as Home Manager.
  home:
    url: path:./home
  pi-nix:
    follows: home/pi-nix
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
